plugins {
    id "com.android.application"
}

android {
    namespace "dev.gabe284.nnapiprobe"
    compileSdk 35

    defaultConfig {
        applicationId "dev.gabe284.nnapiprobe"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O2"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
