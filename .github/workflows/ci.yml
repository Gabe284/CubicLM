name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Flutter with dependency cache
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          pub-cache-key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
      - run: flutter pub get
      - run: flutter analyze
      # Sequential: test files share Hive backing paths on disk, so
      # parallel runs flake (known cross-file interference, e.g.
      # cloud_provider_order). Sequential is deterministic and fits
      # the timeout (~4 min).
      - run: flutter test --concurrency=1
